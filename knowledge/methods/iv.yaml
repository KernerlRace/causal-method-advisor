id: iv
name: Instrumental variables (2SLS)
name_ru: Инструментальные переменные
family: iv
question_types: [effect]
estimand: LATE
summary: Use a variable that shifts the treatment but affects the outcome only through it, so the effect is identified even with unobserved confounders.
requires:
  structure: [cross_section, panel]
  treatment_types: [binary, continuous]
  needs: [instrument]
  min_rows: 100
recommended:
  min_rows: 1000
assumptions:
  - relevance (the instrument really moves the treatment)
  - exclusion restriction (the instrument affects the outcome only through the treatment)
  - the instrument is as good as random (no confounding of instrument and outcome)
  - monotonicity, for a LATE interpretation
diagnostics: [first_stage_strength, sample_size]
good_flags:
  hidden_confounding: IV is one of the few ways to handle unobserved confounders
bad_flags:
  weak_instrument: a weak instrument gives biased and very noisy estimates
  small_sample: IV estimates have large variance, small samples make it worse
libraries: [linearmodels, dowhy, econml]
sources: ["Molak ch. 6", "Facure ch. 8-9"]
